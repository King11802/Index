<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWD Tag Monitor Dashboard | Secure Enterprise Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #080c14;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-glow: rgba(56, 189, 248, 0.25);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --live-green: #10b981;
      --danger: #ef4444;
      --js-yellow: #f7df1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-dark) 60%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      overflow: hidden;
      user-select: none;
    }

    /* 頂部操作列 */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: #323330;
      border: 1px solid rgba(247, 223, 30, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--js-yellow);
      box-shadow: 0 0 14px rgba(247, 223, 30, 0.25);
    }

    .brand-info h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--live-green);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 2px 7px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: var(--live-green);
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .metric-tags {
      display: flex;
      gap: 10px;
    }

    .metric-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-pill strong {
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
    }

    .clickable-host {
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .clickable-host:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clock-display {
      font-size: 12px;
      color: var(--accent);
      font-family: 'Courier New', Courier, monospace;
      padding: 6px 12px;
      background: rgba(56, 189, 248, 0.05);
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      font-weight: 600;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .btn kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
      color: var(--accent);
    }

    /* 視窗外框容器：乾淨裁切，零模糊 */
    .viewport-outer {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-glow);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8);
    }

    .crop-frame-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 36px);
    }

    .report-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 密碼驗證視窗 */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    .auth-box {
      width: 380px;
      padding: 36px 30px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
    }

    .auth-icon {
      font-size: 38px;
      color: var(--accent);
      margin-bottom: 16px;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
    }

    .auth-box h2 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .auth-box p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: all 0.25s ease;
      margin-bottom: 14px;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .login-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .error-msg {
      margin-top: 12px;
      font-size: 12px;
      color: var(--danger);
      display: none;
    }
  </style>
</head>
<body>

  <!-- 密碼登入驗證彈窗 -->
  <div class="lock-screen" id="lockScreen">
    <div class="auth-box">
      <i class="fa-solid fa-shield-halved auth-icon"></i>
      <h2>Restricted Access</h2>
      <p>TWD Tag Monitor Operational Portal</p>
      
      <input type="password" id="accessPass" class="input-field" placeholder="Enter Security Key" autocomplete="off" />
      <button class="login-btn" onclick="verifyAndUnlock()">UNLOCK SYSTEM</button>
      <div class="error-msg" id="errorMsg"><i class="fa-solid fa-triangle-exclamation"></i> Invalid Security Key. Access Denied.</div>
    </div>
  </div>

  <!-- 頂部自訂操作導航列 -->
  <header class="dashboard-header">
    <div class="brand-section">
      <div class="brand-icon" title="JavaScript Engine Active">
        <i class="fa-brands fa-js"></i>
      </div>
      <div class="brand-info">
        <h1>
          TWD Tag Monitor Dashboard
          <span class="live-badge">
            <span class="live-dot"></span>
            ACTIVE MONITORING
          </span>
        </h1>
      </div>
    </div>

    <!-- 中間指標卡片 -->
    <div class="metric-tags">
      <div class="metric-pill">
        <i class="fa-solid fa-network-wired" style="color: var(--accent);"></i>
        <span>IP: <strong id="userIp">218.252.63.125</strong></span>
      </div>
      <div class="metric-pill">
        <i class="fa-solid fa-server" style="color: var(--accent);"></i>
        <span>Hostname: <strong id="userHost" class="clickable-host" onclick="editHostname()" title="點擊可修改 Hostname">KING11802</strong></span>
      </div>
      <div class="metric-pill">
        <i class="fa-solid fa-layer-group" style="color: var(--accent);"></i>
        <span>Tag: <strong>Server Sync</strong></span>
      </div>
    </div>

    <!-- 右側控制按鈕 -->
    <div class="controls">
      <div class="clock-display" id="clock">--:--:-- LOC</div>
      <button class="btn" onclick="refreshReport()">
        <i class="fa-solid fa-arrows-rotate"></i> Sync
      </button>
      <button class="btn" onclick="toggleFullScreen()">
        <i class="fa-solid fa-expand"></i> Fullscreen
      </button>
      <button class="btn" onclick="lockPortal()" title="Lock Screen (Ctrl+L / Esc)">
        <i class="fa-solid fa-lock"></i> Lock <kbd>Ctrl+L</kbd>
      </button>
    </div>
  </header>

  <!-- 報表主視窗 -->
  <main class="viewport-outer" id="viewport">
    <div class="crop-frame-wrapper">
      <iframe 
        id="powerbiFrame"
        class="report-iframe" 
        src="https://app.powerbi.com/view?r=eyJrIjoiZGM2OGNkNTAtYzdhOC00NzhkLWI0NTYtN2YwNGVkMGRjZTdkIiwidCI6IjE3YTE1OTc2LWYzYmUtNGY4Ny1hY2RlLTQ2NmU4NjMwM2Y3ZiIsImMiOjF9" 
        allowFullScreen="true">
      </iframe>
    </div>
  </main>

  <script>
    const VALID_PASS = "580198";
    const DEFAULT_HOSTNAME = "KING11802";
    
    // Google Apps Script Webhook 網址
    const TELEMETRY_API_URL = "https://script.google.com/macros/s/AKfycbxKfyvQ3bs_v3KXYUYLSdFuDQi89jgdVkDqFmOLKmSGcM_a3jJNwtDcUR_8OPC6vvN6zw/exec";

    // 存取記錄靜默發送函數
    async function sendAccessTelemetry(actionType) {
      const host = localStorage.getItem('twd_custom_hostname') || DEFAULT_HOSTNAME;
      let ip = document.getElementById('userIp').textContent;

      if (!ip || ip === "Loading..." || ip === "218.252.63.125") {
        try {
          const res = await fetch('https://api.ipify.org?format=json');
          const data = await res.json();
          ip = data.ip;
          document.getElementById('userIp').textContent = ip;
        } catch(e) {
          ip = "Unknown / LAN";
        }
      }

      // 背景靜默非同步回傳至 Google 表單 (mode: 'no-cors' 保證零延遲且不報錯)
      try {
        fetch(TELEMETRY_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            ip: ip,
            hostname: host,
            action: actionType
          })
        }).catch(() => {});
      } catch (err) {}
    }

    async function initClientDetails() {
      const savedHost = localStorage.getItem('twd_custom_hostname') || DEFAULT_HOSTNAME;
      document.getElementById('userHost').textContent = savedHost;

      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        document.getElementById('userIp').textContent = data.ip;
      } catch (e) {
        document.getElementById('userIp').textContent = "218.252.63.125";
      }

      // 軟體打開時靜默記錄一次
      sendAccessTelemetry("APP_OPEN (EXE 開啟)");
    }

    function editHostname() {
      const current = document.getElementById('userHost').textContent;
      const input = prompt("請輸入此電腦的 Hostname（電腦名稱）：", current);
      if (input && input.trim() !== "") {
        const newHost = input.trim().toUpperCase();
        localStorage.setItem('twd_custom_hostname', newHost);
        document.getElementById('userHost').textContent = newHost;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initClientDetails();

      if (sessionStorage.getItem('twd_auth_status') === 'unlocked') {
        const lock = document.getElementById('lockScreen');
        lock.style.display = 'none';
      } else {
        document.getElementById('accessPass').focus();
      }
    });

    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey && (e.key === 'l' || e.key === 'L')) || (e.key === 'Escape')) {
        e.preventDefault();
        lockPortal();
      }
      
      if (e.key === 'Enter' && document.getElementById('lockScreen').style.display !== 'none') {
        verifyAndUnlock();
      }
    });

    function verifyAndUnlock() {
      const passInput = document.getElementById('accessPass');
      const errorMsg = document.getElementById('errorMsg');
      const val = passInput.value.trim();

      if (val === VALID_PASS) {
        errorMsg.style.display = 'none';
        sessionStorage.setItem('twd_auth_status', 'unlocked');
        
        // 密碼解鎖成功時再記錄一次
        sendAccessTelemetry("LOGIN_SUCCESS (解鎖進入)");

        const lock = document.getElementById('lockScreen');
        lock.style.opacity = '0';
        setTimeout(() => {
          lock.style.display = 'none';
        }, 350);
      } else {
        errorMsg.style.display = 'block';
        passInput.value = '';
        passInput.focus();
      }
    }

    function refreshReport() {
      const frame = document.getElementById('powerbiFrame');
      frame.src = frame.src;
    }

    function lockPortal() {
      sessionStorage.removeItem('twd_auth_status');
      const lock = document.getElementById('lockScreen');
      lock.style.display = 'flex';
      lock.style.opacity = '1';
      const passInput = document.getElementById('accessPass');
      passInput.value = '';
      passInput.focus();
    }

    function toggleFullScreen() {
      const viewport = document.getElementById('viewport');
      if (!document.fullscreenElement) {
        viewport.requestFullscreen ? viewport.requestFullscreen() : viewport.webkitRequestFullscreen();
      } else {
        document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen();
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0] + ' LOC';
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
